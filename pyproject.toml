[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bsc-extended-intro-cs-hw5"
version = "1.0.0"
description = "Matrices, partial functions, binary search trees, and sequence substring matching"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Kobie Hazon" }]
dependencies = []

[project.scripts]
extended-intro-hw5 = "extended_intro_hw5_cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
only-include = ["src/extended_intro_hw5.py", "src/extended_intro_hw5_cli.py"]
sources = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["assignment", "solution", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
